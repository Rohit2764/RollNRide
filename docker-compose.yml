version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rollnride_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rollnride
      POSTGRES_PASSWORD: rollnride_secret
      POSTGRES_DB: rollnride_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rollnride -d rollnride_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rollnride_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: rollnride_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://rollnride:rollnride_secret@postgres:5432/rollnride_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_rollnride_jwt_key_development_change_in_production_987654321
      - ENVIRONMENT=production
      - SIMULATION_ENABLED=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: rollnride_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
