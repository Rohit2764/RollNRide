services:
  # Backend FastAPI Service (with WebSockets & SQLite/PostgreSQL)
  - type: web
    name: rollnride-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATION_ENABLED
        value: "true"

  # Frontend Static Web App (React 18 + Vite + Tailwind)
  - type: web
    name: rollnride-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rollnride-backend
          property: host
